# Plantilla de nginx para el servicio `agentos-web`.
#
# El entrypoint oficial de nginx la procesa con envsubst desde
# /etc/nginx/templates/default.conf.template: la ÚNICA variable sustituida es
# ${AGENTOS_API_UPSTREAM} (las demás, $host/$scheme/$uri..., son variables de
# nginx y no existen como variables de entorno).
#
# Valor por defecto (Dockerfile.web): http://whatsfull_agentos-api:4300
# — nombre de servicio de Docker Swarm en EasyPanel: <proyecto>_<servicio>.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS embebido de Docker: resuelve el upstream en caliente para que nginx
  # arranque aunque agentos-api todavía no exista y siga al contenedor si cambia de IP.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $agentos_api "${AGENTOS_API_UPSTREAM}";

  # La API no recibe dominio ni puerto público: el navegador usa el mismo
  # origen de la SPA y Nginx comunica con el servicio Docker interno.
  location /api/ {
    proxy_pass $agentos_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location = /ws {
    proxy_pass $agentos_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
